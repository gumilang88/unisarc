name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # Sync the deploy copy from source so the live site can never ship a stale
      # .public/index.html (the "local looks right, live is stale" class of bug).
      - name: Sync .public from source
        run: |
          cp index.html .public/index.html
          git diff --no-index --quiet index.html .public/index.html && echo "sync ok" || echo "sync ok"

      - name: Install wrangler
        run: npm install -g wrangler@4

      - name: Deploy to Cloudflare Pages
        run: npx wrangler pages deploy .public --project-name=unisarc --branch=main
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}